version: 2

updates:
  # The root pnpm workspace contains packages, demo and examples.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      workspace-dependencies:
        patterns:
          - "*"

  # Keep GitHub Actions updates separate from JavaScript dependencies.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
