name: Update visual docs

on:
  workflow_dispatch:
  push:
    tags:
      - "levita-js@*"
      - "@levita-js/**@*"

permissions:
  contents: write

jobs:
  update-animations:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: volta-cli/action@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter levita-js build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Record animation frames
        run: npx playwright test --grep demo

      - name: Convert to animated WebP
        run: sudo apt-get install -y webp && ./tests/visual/convert-to-webp.sh

      - name: Commit updated animations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:main
          git checkout main
          git add docs/animations/*.webp
          if git diff --cached --quiet; then
            echo "No animation changes to commit"
          else
            git commit -m "docs: update animated visual effects [skip ci]"
            git push
          fi
