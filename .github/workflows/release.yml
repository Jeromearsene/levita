name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM
        id: publish
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          pnpm build
          # Loop through packages and publish using native npm with explicit OIDC force mode
          # The _authType=oidc flag is the key for strict NPM accounts (disallow tokens)
          for pkg in packages/*; do
            if [ -d "$pkg" ]; then
              echo "Checking package in $pkg..."
              cd "$pkg"
              NAME=$(node -p "require('./package.json').name")
              VERSION=$(node -p "require('./package.json').version")
              
              if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
                echo "$NAME@$VERSION already published, skipping."
              else
                echo "Publishing $NAME@$VERSION via OIDC Force Mode..."
                npm publish \
                  --access public \
                  --provenance \
                  --//registry.npmjs.org/:_authType=oidc
              fi
              cd -
            fi
          done
          # Create and push git tags manually
          npx changeset tag
          git push --tags
          echo "published=true" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync examples to published versions
        if: steps.publish.outputs.published == 'true'
        run: |
          node scripts/sync-examples.js
          pnpm install --no-frozen-lockfile
          branch="chore/sync-examples-$(date +%s)"
          git checkout -b "$branch"
          git add examples/ pnpm-lock.yaml
          git commit -m "chore: sync examples to published versions"
          git push origin "$branch"
          pr_url=$(gh pr create \
            --title "chore: sync examples to published versions" \
            --body "Auto-generated after npm publish. Updates example dependencies to the newly released version." \
            --base main \
            --head "$branch")
          gh pr merge "$pr_url" --squash --auto
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_TOKEN }}
