name: Release Sandbox

on:
  push:
    branches:
      - test-oidc
  workflow_dispatch:

jobs:
  publish-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # OIDC trusted publishing needs a Node/npm combo that supports the
          # full handshake. Node 22 kept giving misleading 404s; 24 fixes it.
          node-version: 24
          cache: pnpm
          # Deliberately NOT setting registry-url here: setup-node writes an
          # .npmrc with _authToken=${NODE_AUTH_TOKEN}, and since NODE_AUTH_TOKEN
          # is never set in this workflow, older pnpm/npm sent that literal
          # unresolved placeholder as a bearer token instead of falling back
          # to OIDC — which is exactly what produced our 404s. Each package
          # already declares its registry via publishConfig.registry, so this
          # isn't needed for publishing to succeed.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Test Publish
        run: |
          # Testing scoped package first to verify OIDC health
          for pkg in packages/react packages/core packages/angular packages/svelte packages/vue; do
            if [ -d "$pkg" ]; then
              echo "-----------------------------------"
              echo "Processing $pkg..."
              cd "$pkg"
              NAME=$(node -p "require('./package.json').name")
              VERSION=$(node -p "require('./package.json').version")
              
              if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
                echo "$NAME@$VERSION already published, skipping."
              else
                echo "Publishing $NAME@$VERSION via OIDC..."
                npm publish --access public --provenance
              fi
              cd -
            fi
          done
